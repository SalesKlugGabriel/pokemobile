server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # 🔴 Sem isto, o `return 301` abaixo devolve a URL ABSOLUTA que o nginx
    # enxerga — `http://host:8080/painel/`. Mas quem fala com o nginx é o
    # Traefik: de fora, a porta 8080 não existe e o esquema é HTTPS. O
    # navegador seguiria o redirecionamento pra um endereço morto.
    # Desligando, o redirecionamento sai relativo e o proxy resolve certo.
    absolute_redirect off;

    location / {
        # Exigido pelo Godot Web export (WebAssembly com memória compartilhada).
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri $uri/ =404;
    }

    # ── O painel do Gabriel ────────────────────────────────────────────────
    #
    # 🔴 Ele NÃO pode herdar os cabeçalhos acima, e isso não é preferência.
    # `Cross-Origin-Embedder-Policy: require-corp` manda o navegador recusar
    # qualquer recurso de outra origem que não se declare compartilhável — e o
    # painel carrega a fonte do Google Fonts. Herdando, a folha de estilo seria
    # **bloqueada sem erro visível**: a página abriria com a fonte do sistema e
    # ninguém saberia por quê.
    #
    # Os dois cabeçalhos existem só pro WebAssembly do jogo, que mora em `/`.
    # O painel é HTML comum e não precisa de nenhum dos dois.
    #
    # ⚠️ No nginx, um `add_header` dentro de um bloco **cancela** os herdados —
    # por isso as diretivas do jogo foram movidas pra dentro de `location /`,
    # em vez de ficarem no nível do servidor: assim cada rota declara o que
    # precisa, e nenhuma herda o que não pediu.
    # 🔴 21/09: o painel público vira um ESPELHO declarado, não o painel.
    #
    # O Gabriel abriu `poke.workprog.pro/painel` e não conseguiu aprovar nada —
    # e estava certo: os botões precisam de `claude.use("db")`, que só existe na
    # versão publicada como Artifact. Duas cópias do mesmo painel, uma com
    # botões e outra sem, é exatamente o "dois lugares decidindo a mesma coisa"
    # que este projeto não aceita em nenhum outro lugar.
    #
    # A cópia continua servida (dá pra LER sem estar logado, e isso tem valor),
    # mas ela própria diz que é espelho e aponta pro painel de verdade — em vez
    # de oferecer botões mortos.
    location /painel/ {
        try_files $uri $uri/ /painel/index.html;
    }

    # ── O atalho do laboratório 3D ──────────────────────────────────────────
    #
    # 🔴 21/09: o Gabriel abria `/v3d/` havia semanas e passou a ver 404.
    # Conferido em toda versão do nginx.conf, em todas as branches, e nos
    # rótulos do Traefik: **este caminho nunca existiu aqui**. Ele não viu uma
    # página morrer — usava um endereço que nunca esteve no ar.
    #
    # A resposta pior seria corrigi-lo. O endereço que ele tem na memória virou
    # o atalho oficial: serve os MESMOS arquivos do jogo, e a tela inicial lê o
    # caminho e vai direto pro laboratório (ver `TitleScreen._porta_da_v3`).
    #
    # ⚠️ `alias` e não `root`: com `root` o nginx procuraria
    # `/usr/share/nginx/html/v3d/index.js`, que não existe. Com `alias`, os
    # caminhos relativos do export do Godot (`index.js`, `index.pck`) caem no
    # lugar certo.
    #
    # ⚠️ E os dois cabeçalhos de origem cruzada são OBRIGATÓRIOS aqui: isto é o
    # jogo, e sem eles o WebAssembly com memória compartilhada não sobe. É o
    # simétrico exato do `/painel/`, que não pode tê-los.
    location /v3d/ {
        alias /usr/share/nginx/html/;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri $uri/ /index.html;
    }

    location = /v3d {
        return 301 /v3d/;
    }

    # Sem isto, abrir `/painel` (sem a barra) procura um ARQUIVO com esse nome
    # e devolve 404 — e é exatamente assim que a pessoa vai digitar.
    location = /painel {
        return 301 /painel/;
    }
}
